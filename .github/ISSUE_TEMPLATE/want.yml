name: "📌 I want to read this eventually"
description: Add a paper to your want queue. It'll show up in a deep slot on a later day.
title: "want: "
labels: ["scout:want"]
body:
  - type: input
    id: paper
    attributes:
      label: Paper
      description: arXiv id, DOI, or URL.
    validations:
      required: true
  - type: input
    id: why
    attributes:
      label: Why (optional)
  - type: input
    id: by_when
    attributes:
      label: By when (optional, YYYY-MM-DD)
