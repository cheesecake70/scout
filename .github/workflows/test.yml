name: tests
on:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -e ".[dev]"
      - run: pytest -q
