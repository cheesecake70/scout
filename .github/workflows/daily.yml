name: daily

on:
  schedule:
    # GitHub fires scheduled runs late and irregularly; this runs every 30 min and the job itself
    # runs once per day, on the first firing at or after the configured local hour (DST-safe)
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print picks without writing anything"
        type: boolean
        default: false
      force:
        description: "Run even if it's not the configured hour"
        type: boolean
        default: true

concurrency:
  group: scout-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is it time?
        id: when
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, yaml, datetime, zoneinfo
          s = yaml.safe_load(open("config/settings.yaml")) or {}
          tz = zoneinfo.ZoneInfo(s.get("schedule", {}).get("timezone", "UTC"))
          hour = int(s.get("schedule", {}).get("hour", 7))
          now = datetime.datetime.now(tz)
          state = {}
          try:
              import json; state = json.load(open("data/state.json"))
          except Exception: pass
          already = now.date().isoformat() in state.get("run_days", [])
          forced = os.environ.get("FORCE", "false") == "true"
          go = forced or (now.hour >= hour and not already)
          print(f"go={'true' if go else 'false'}")
          print(f"why=local {now:%Y-%m-%d %H:%M} {tz.key}; target hour {hour}; already ran today: {already}; forced: {forced}")
          PY
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

      - name: Skip (not the hour)
        if: steps.when.outputs.go != 'true'
        run: echo "${{ steps.when.outputs.why }}"

      - uses: actions/setup-python@v5
        if: steps.when.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding model + API cache
        if: steps.when.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/cache
          key: scout-cache-${{ hashFiles('config/settings.yaml') }}-${{ github.run_number }}
          restore-keys: |
            scout-cache-${{ hashFiles('config/settings.yaml') }}-
            scout-cache-

      - name: Install
        if: steps.when.outputs.go == 'true'
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -e ".[embed,anthropic,gemini,groq]"

      - name: Run
        if: steps.when.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENREVIEW_TOKEN: ${{ secrets.OPENREVIEW_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            scout run-daily --dry-run
          else
            scout run-daily
          fi

      - name: Commit state
        if: steps.when.outputs.go == 'true' && inputs.dry_run != true
        run: |
          git config user.name "scout[bot]"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data notes
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "scout: picks for $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
