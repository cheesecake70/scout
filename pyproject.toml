[project]
name = "scout"
version = "0.1.0"
description = "A daily research-reading practice: 1-3 papers a day, a two-box reflection, and a notebook that drives tomorrow's picks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2",
  "jinja2>=3.1",
  "numpy>=1.26",
  "feedparser>=6",
  "python-frontmatter>=1.1",
  "markdown>=3.6",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3", "torch>=2"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1"]
groq = ["groq>=0.11"]
all = ["scout[embed,anthropic,gemini,groq]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.ruff]
line-length = 100
